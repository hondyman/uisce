  # ---------------------------------------------------------
  # MinIO Object Storage (Iceberg Warehouse)
  # ---------------------------------------------------------
  uisce-minio:
    image: minio/minio:latest
    container_name: uisce-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      TZ: UTC
    networks:
      - remote-net
    volumes:
      - uisce_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  lakekeeper-minio-init:
    image: minio/mc:latest
    container_name: lakekeeper-minio-init
    depends_on:
      uisce-minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set myminio http://uisce-minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/iceberg-warehouse --ignore-existing;
      echo 'Lakekeeper warehouse bucket ready';
      "
    networks:
      - remote-net

  # ---------------------------------------------------------
  # DataFusion Arrow Flight SQL Server (Iceberg query engine)
  # Native cold tier Iceberg query engine. Provides:
  #   - REST SQL endpoint on :8555
  #   - Arrow Flight SQL on :8554 (reserved for future Flight clients)
  #   - Native PyIceberg integration for the Iceberg cold store
  #
  # Built from ./datafusion-build/ (server.py + Dockerfile) on the
  # remote host. Use the same Dockerfile in backend/ for local dev:
  #   context: ./backend
  #   dockerfile: Dockerfile.datafusion-flight-sql
  # ---------------------------------------------------------
  # uisce-datafusion:  # DISABLED - build directive broken
  #     build:
  #       context: ./datafusion-build
  #       dockerfile: Dockerfile
  #     image: uisce-datafusion:local
  #     container_name: uisce-datafusion
  #     user: root
