  #       AWS_S3_FORCE_PATH_STYLE: "true"
  #       AWS_ALLOW_HTTP: "true"
  #       AWS_S3_ALLOW_HTTP: "true"
      # Legacy S3 vars retained for older clients (PyIceberg uses AWS_ENDPOINT_URL)
  #       AWS_ACCESS_KEY_ID: "${DATA_FUSION_AWS_ACCESS_KEY_ID:-minioadmin}"
  #       AWS_SECRET_ACCESS_KEY: "${DATA_FUSION_AWS_SECRET_ACCESS_KEY:-minioadmin}"
  #       AWS_REGION: "${DATA_FUSION_AWS_REGION:-us-east-1}"
  #       AWS_DEFAULT_REGION: "${DATA_FUSION_AWS_REGION:-us-east-1}"
  #       AWS_S3_ENDPOINT: "${DATA_FUSION_S3_ENDPOINT:-http://uisce-minio:9000}"
  #       S3_ENDPOINT: "${DATA_FUSION_S3_ENDPOINT:-http://uisce-minio:9000}"
  #       S3_ACCESS_KEY: "${DATA_FUSION_AWS_ACCESS_KEY_ID:-minioadmin}"
  #       S3_SECRET_KEY: "${DATA_FUSION_AWS_SECRET_ACCESS_KEY:-minioadmin}"
  #       S3_PATH_STYLE_ACCESS: "true"
      # Iceberg REST catalog endpoint & credentials for Apache Polaris
  #       ICEBERG_CATALOG_URI: "${ICEBERG_CATALOG_URI:-http://lakekeeper:8181}"
  #       ICEBERG_REST_CREDENTIAL: "${ICEBERG_REST_CREDENTIAL:-root:secret}"
  #       ICEBERG_WAREHOUSE: "${ICEBERG_WAREHOUSE:-tenant-alpha}"
  #       ICEBERG_REST_SCOPE: "${ICEBERG_REST_SCOPE:-PRINCIPAL_ROLE:ALL}"
      # Warehouse bucket
  #       WAREHOUSE_BUCKET: "${WAREHOUSE_BUCKET:-iceberg-warehouse}"
      # Timezone (UTC)
  #       TZ: UTC
      # Logging
  #       RUST_LOG: info
  #       PYTHONUNBUFFERED: "1"
  #     healthcheck:
  #       test: ["CMD-SHELL", "curl -f http://localhost:8555/health || exit 1"]
  #       interval: 30s
  #       timeout: 10s
  #       start_period: 90s
  #       retries: 5
  #     restart: unless-stopped
  # 
  # ===========================================================
  # Lakekeeper — Rust-native Iceberg REST Catalog
  # Replaces Apache Polaris. Uses its own PostgreSQL 17 for
  # catalog metadata and existing uisce-minio for S3 storage.
  # ===========================================================
  lakekeeper-db:
    image: postgres:17
    container_name: lakekeeper-db
    environment:
      POSTGRES_PASSWORD: postgres
      PGTZ: UTC
    command: postgres -c timezone=UTC
    volumes:
      - lakekeeper_pgdata:/var/lib/postgresql/data
    networks:
      - remote-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -p 5432 -d postgres"]
      interval: 2s
      timeout: 10s
      retries: 10

  lakekeeper-migrate:
    image: quay.io/lakekeeper/catalog:latest-main
    container_name: lakekeeper-migrate
    restart: "no"
    environment:
      - LAKEKEEPER__PG_DATABASE_URL_READ=postgresql://postgres:postgres@lakekeeper-db:5432/postgres
      - LAKEKEEPER__PG_DATABASE_URL_WRITE=postgresql://postgres:postgres@lakekeeper-db:5432/postgres
      - LAKEKEEPER__PG_ENCRYPTION_KEY=${LAKEKEEPER_PG_ENCRYPTION_KEY}
      - RUST_LOG=info
    command: ["migrate"]
    networks:
      - remote-net
    depends_on:
      lakekeeper-db:
        condition: service_healthy

  lakekeeper:
    image: quay.io/lakekeeper/catalog:latest-main
    container_name: lakekeeper
    environment:
      - LAKEKEEPER__PG_DATABASE_URL_READ=postgresql://postgres:postgres@lakekeeper-db:5432/postgres?options=-c%20timezone=utc
      - LAKEKEEPER__PG_DATABASE_URL_WRITE=postgresql://postgres:postgres@lakekeeper-db:5432/postgres?options=-c%20timezone=utc
      - LAKEKEEPER__PG_ENCRYPTION_KEY=${LAKEKEEPER_PG_ENCRYPTION_KEY}
      - LAKEKEEPER__BASE_URI=http://localhost:8181
      - LAKEKEEPER__ENABLE_DEFAULT_PROJECT=true
      - RUST_LOG=info
      - TZ=UTC
    command: ["serve"]
    ports:
      - "8181:8181"
    networks:
      - remote-net
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully
      lakekeeper-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------
  # StarRocks — hot-tier OLAP store for pre-aggregated
  # calculated semantic terms, fed by the CDC pipeline:
  # cmd/cdc_service or a Debezium Postgres connector ->
  # uisce-redpanda -> cmd/stream_loader -> StarRocks stream
  # load API. Uses the existing uisce-minio for object storage.
  # ---------------------------------------------------------
  starrocks-fe:
    image: starrocks/fe-ubuntu:3.3-latest
    hostname: starrocks-fe
    container_name: starrocks-fe
    ports:
      - "8030:8030"
      - "9020:9020"
      - "9030:9030"
    volumes:
      - starrocks_fe_meta:/opt/starrocks/fe/meta
      - ./infrastructure/docker/starrocks/fe.conf:/opt/starrocks/fe/conf/fe.conf:ro
    environment:
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_REGION=us-east-1
      - TZ=UTC
      - priority_networks=172.20.0.0/16
    command: >
      /opt/starrocks/fe/bin/start_fe.sh
    networks:
      - remote-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8030/api/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  starrocks-be:
    image: starrocks/be-ubuntu:3.3-latest
    hostname: starrocks-be
    container_name: starrocks-be
    ports:
      - "8040:8040"
      - "9060:9060"
    volumes:
      - starrocks_be_storage:/opt/starrocks/be/storage
    environment:
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_REGION=us-east-1
      - TZ=UTC
    command: >
      /opt/starrocks/be/bin/start_be.sh
    depends_on:
      starrocks-fe:
        condition: service_healthy
    networks:
      - remote-net
    restart: unless-stopped

  # ---------------------------------------------------------
  # Stream Loader — consumes Debezium change events for
  # orm.execution from Kafka and stream-loads decoded rows
  # into StarRocks (oms.orm_execution). One instance per
  # source table; add more services here (same image, different
  # CDC_TOPIC/STARROCKS_TABLE) as additional OMS tables get
  # pre-aggregation coverage. See cmd/stream_loader/main.go for
  # the Debezium envelope / Decimal-field decoding.
  # ---------------------------------------------------------
  uisce-stream-loader-execution:
    build:
      context: .
      dockerfile: backend/Dockerfile.loader
    image: uisce-stream-loader:local
    container_name: uisce-stream-loader-execution
    environment:
      KAFKA_BROKERS: uisce-redpanda:9092
      CDC_TOPIC: orm_oms.orm.execution
      STARROCKS_HTTP: http://starrocks-fe:8030
      STARROCKS_USER: root
      STARROCKS_PASSWORD: ""
      STARROCKS_DB: oms
      STARROCKS_TABLE: orm_execution
    networks:
      - remote-net
    depends_on:
      starrocks-fe:
        condition: service_healthy
    restart: unless-stopped

  uisce-stream-loader-order:
    build:
      context: .
      dockerfile: backend/Dockerfile.loader
    image: uisce-stream-loader:local
    container_name: uisce-stream-loader-order
    environment:
      KAFKA_BROKERS: uisce-redpanda:9092
      CDC_TOPIC: orm_oms.orm.order
      STARROCKS_HTTP: http://starrocks-fe:8030
      STARROCKS_USER: root
      STARROCKS_PASSWORD: ""
      STARROCKS_DB: oms
      STARROCKS_TABLE: orm_order
    networks:
      - remote-net
    depends_on:
      starrocks-fe:
        condition: service_healthy
    restart: unless-stopped

  uisce-stream-loader-placement:
    build:
      context: .
      dockerfile: backend/Dockerfile.loader
    image: uisce-stream-loader:local
    container_name: uisce-stream-loader-placement
    environment:
      KAFKA_BROKERS: uisce-redpanda:9092
      CDC_TOPIC: orm_oms.orm.placement
      STARROCKS_HTTP: http://starrocks-fe:8030
      STARROCKS_USER: root
      STARROCKS_PASSWORD: ""
      STARROCKS_DB: oms
      STARROCKS_TABLE: orm_placement
    networks:
      - remote-net
    depends_on:
      starrocks-fe:
        condition: service_healthy
    restart: unless-stopped

  uisce-stream-loader-order-allocation:
    build:
      context: .
      dockerfile: backend/Dockerfile.loader
    image: uisce-stream-loader:local
    container_name: uisce-stream-loader-order-allocation
    environment:
      KAFKA_BROKERS: uisce-redpanda:9092
      CDC_TOPIC: orm_oms.orm.order_allocation
      STARROCKS_HTTP: http://starrocks-fe:8030
      STARROCKS_USER: root
      STARROCKS_PASSWORD: ""
      STARROCKS_DB: oms
      STARROCKS_TABLE: orm_order_allocation
    networks:
      - remote-net
    depends_on:
      starrocks-fe:
        condition: service_healthy
    restart: unless-stopped

  uisce-stream-loader-execution-allocation:
    build:
      context: .
      dockerfile: backend/Dockerfile.loader
    image: uisce-stream-loader:local
    container_name: uisce-stream-loader-execution-allocation
    environment:
      KAFKA_BROKERS: uisce-redpanda:9092
      CDC_TOPIC: orm_oms.orm.execution_allocation
      STARROCKS_HTTP: http://starrocks-fe:8030
      STARROCKS_USER: root
      STARROCKS_PASSWORD: ""
      STARROCKS_DB: oms
      STARROCKS_TABLE: orm_execution_allocation
    networks:
      - remote-net
    depends_on:
      starrocks-fe:
        condition: service_healthy
