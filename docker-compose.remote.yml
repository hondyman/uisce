  # ---------------------------------------------------------
  # Aggregate Consumer — replaces the dropped Postgres triggers
  # (see backend/db/migrations/20260920_002*.sql). Consumes CDC
  # events from the alpha-trg / crims-trg connectors and runs the
  # same aggregate-maintenance / RBAC-seeding / versioning logic
  # the triggers used to perform.
  #
  # HANDLERS_TOPICS is a comma-separated list of source topics.
  # Each topic registers a handler (see buildHandlers in main.go).
  # DATABASE_URL is the target DB the consumer writes aggregates to.
  #
  # Two instances for database isolation:
  #   - aggregate-consumer-alpha → alpha DB, alpha_trg.* topics
  #   - aggregate-consumer-crims → crims DB, crims_trg.* topics
  # ---------------------------------------------------------
  uisce-aggregate-consumer-alpha:
    build:
      context: .
      dockerfile: backend/Dockerfile.aggregate_consumer
    image: uisce-aggregate-consumer:local
    container_name: uisce-aggregate-consumer-alpha
    environment:
      KAFKA_BROKERS: uisce-redpanda:9092
      KAFKA_GROUP_ID: aggregate-consumer-alpha
      DLQ_TOPIC: dlq.alpha_trg
      DATABASE_URL: ${ALPHA_DATABASE_URL}
      HANDLERS_TOPICS: >-
        alpha_trg.public.template_ratings,
        alpha_trg.public.cube_custom_models,
        alpha_trg.public.cube_security_policies,
        alpha_trg.public.semantic_query_templates,
        alpha_trg.public.investment_opportunities,
        alpha_trg.public.security_user_fund_access,
        alpha_trg.public.metrics_registry
    volumes:
      - /home/eganpj/.uisce/certs/ca.crt:/tmp/orm_ca.crt:ro
      - /home/eganpj/.uisce/certs/postgres-client.crt:/tmp/orm_client.crt:ro
      - /home/eganpj/.uisce/certs-shared/orm_client_der.pk8:/tmp/orm_client_der.pk8:ro
    networks:
      - remote-net
    depends_on:
      uisce-redpanda:
        condition: service_healthy
    restart: unless-stopped

  uisce-aggregate-consumer-crims:
    build:
      context: .
      dockerfile: backend/Dockerfile.aggregate_consumer
    image: uisce-aggregate-consumer:local
    container_name: uisce-aggregate-consumer-crims
    environment:
      KAFKA_BROKERS: uisce-redpanda:9092
      KAFKA_GROUP_ID: aggregate-consumer-crims
      DLQ_TOPIC: dlq.crims_trg
      DATABASE_URL: ${CRIMS_DATABASE_URL}
      HANDLERS_TOPICS: crims_trg.orm.security_identifier
    volumes:
      - /home/eganpj/.uisce/certs/ca.crt:/tmp/orm_ca.crt:ro
      - /home/eganpj/.uisce/certs/postgres-client.crt:/tmp/orm_client.crt:ro
      - /home/eganpj/.uisce/certs-shared/orm_client_der.pk8:/tmp/orm_client_der.pk8:ro
    networks:
      - remote-net
    depends_on:
      uisce-redpanda:
        condition: service_healthy
    restart: unless-stopped

networks:
  remote-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

