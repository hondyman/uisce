[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "uisce-validation"
version = "1.0.0"
description = "Official Python Client SDK for Uisce Centralized Validation Rules Engine"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "urllib3>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["uisce_validation*"]
