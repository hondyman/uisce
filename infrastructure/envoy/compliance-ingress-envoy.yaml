# Envoy Ingress Gateway Configuration for Uisce Compliance Gateway
# Enforces primary consistent-hash load balancing keyed on X-Account-ID header
# so ~100% of order evaluations route directly to the authoritative pod replica.

static_resources:
  listeners:
    - name: compliance_ingress_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_compliance
                codec_type: AUTO
                route_config:
                  name: compliance_routes
                  virtual_hosts:
                    - name: compliance_service
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/api/oms/trade-orders"
                          route:
                            cluster: compliance_gateway_cluster
                            hash_policy:
                              - header:
                                  header_name: "X-Account-ID"
                            timeout: 1.0s
                            retry_policy:
                              retry_on: "5xx,connect-failure,refused-stream"
                              num_retries: 2
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: compliance_gateway_cluster
      connect_timeout: 0.25s
      type: STRICT_DNS
      lb_policy: RING_HASH
      ring_hash_lb_config:
        minimum_ring_size: 1024
        maximum_ring_size: 8192
        hash_function: MURMUR_HASH_2
      load_assignment:
        cluster_name: compliance_gateway_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: compliance-gateway-pod-0.compliance-headless.uisce-system.svc.cluster.local
                      port_value: 8080
              - endpoint:
                  address:
                    socket_address:
                      address: compliance-gateway-pod-1.compliance-headless.uisce-system.svc.cluster.local
                      port_value: 8080
              - endpoint:
                  address:
                    socket_address:
                      address: compliance-gateway-pod-2.compliance-headless.uisce-system.svc.cluster.local
                      port_value: 8080
