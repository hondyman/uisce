{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "uisce.fullname" . }}-netpol
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "uisce.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "uisce.labels" . | nindent 4 }}
      app.kubernetes.io/component: backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: {{ .Release.Namespace }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080   # Gateway
        - protocol: TCP
          port: 8090   # Flight SQL (aspirational)
  egress:
    {{- toYaml .Values.networkPolicy.egress | nindent 4 }}
{{- end }}
