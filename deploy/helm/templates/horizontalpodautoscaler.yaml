{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "uisce.fullname" . }}-hpa
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "uisce.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "uisce.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
{{/*
  TODO: Wire custom VM eval duration metric for p99-based scaling:
  - type: Pods
    pods:
      metric:
        name: uisce_vm_eval_duration_seconds_p99
      target:
        type: AverageValue
        averageValue: "5m"
*/}}
{{- end }}
