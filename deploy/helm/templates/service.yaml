apiVersion: v1
kind: Service
metadata:
  name: {{ include "uisce.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "uisce.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: gateway
      port: {{ .Values.service.ports.gateway }}
      targetPort: gateway
      protocol: TCP
    {{/* Arrow Flight SQL — aspirational stub (listener active, no query handler yet) */}}
    - name: flight-sql
      port: {{ .Values.service.ports.flightSql }}
      targetPort: flight-sql
      protocol: TCP
    {{/* QuickFIX Acceptor — aspirational stub */}}
    - name: fix-acceptor
      port: {{ .Values.service.ports.fixAcceptor }}
      targetPort: fix-acceptor
      protocol: TCP
  selector:
    {{- include "uisce.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
