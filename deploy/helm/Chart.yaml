# =============================================================================
# Uisce Semantic OS — Helm Chart
# =============================================================================
# A G-SIFI-hardened, multi-region Helm chart for the Uisce Semantic OS
# control plane. Built from local source (Kaniko / source-to-image).
#
# Usage:
#   helm install uisce ./deploy/helm --values ./deploy/helm/values-prod-us-east.yaml
#   helm upgrade  uisce ./deploy/helm --values ./deploy/helm/values-prod-us-east.yaml
#
# Prerequisites:
#   - Kubernetes 1.28+
#   - Helm 3.12+
#   - Infisical operator installed in target namespace (for secret injection)
# =============================================================================

apiVersion: v2
name: uisce
description: Uisce Semantic OS — G-SIFI Financial Control Plane
type: application
version: 1.0.0-rc1
appVersion: "1.0.0-rc1"

keywords:
  - uisce
  - compliance
  - raft
  - ebpf
  - g-sifi
  - financial-os

maintainers:
  - name: Uisce Engineering
    url: https://github.com/hondyman/uisce

dependencies: []
