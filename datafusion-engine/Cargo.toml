[package]
name = "datafusion-engine"
version = "0.1.0"
edition = "2021"
description = "DataFusion and Iceberg metadata audit ingestion and OLAP transformation engine"

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "=0.4.39", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }

# Arrow & DataFusion for in-memory processing and OLAP transformations
arrow = "50"
datafusion = "37"

# Iceberg Rust SDK
iceberg = "0.3"
