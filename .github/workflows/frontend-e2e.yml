name: Frontend E2E

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    # A hung Cypress run otherwise holds a runner for the 6h default and starves
    # the account's concurrency (19 of these sat 3-7h and blocked all of CI).
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        # Cypress 15's bundled tsx needs Node >= 20.6 (it loads via --import);
        # on Node 18 the config loader crashes and the job hangs to the timeout.
        node-version: 20
    - name: Install frontend deps
      working-directory: frontend
      run: npm ci --legacy-peer-deps
    - name: Start backend (if needed)
      run: echo "Assumes backend API is available; configure service or mock as needed"
    - name: Run Cypress tests
      working-directory: frontend
      run: npm run cy:run
