name: Deploy Remote

on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The secrets context is not available in step-level `if:`; expose what the
    # conditions need through job env instead.
    env:
      HAS_SSH_KEY: ${{ secrets.REMOTE_SSH_PRIVATE_KEY != '' }}
      HAS_SSH_HOST: ${{ secrets.REMOTE_SSH_HOST != '' }}
      HAS_SSH_PASSWORD: ${{ secrets.REMOTE_SSH_PASSWORD != '' }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Validate required secrets
      run: |
        if [ "$HAS_SSH_HOST" != "true" ]; then echo "ERROR: REMOTE_SSH_HOST secret not set" && exit 1; fi
        if [ "$HAS_SSH_KEY" != "true" ] && [ "$HAS_SSH_PASSWORD" != "true" ]; then echo "ERROR: set REMOTE_SSH_PRIVATE_KEY (or REMOTE_SSH_PASSWORD)" && exit 1; fi

    - name: Start ssh-agent and add key (if provided)
      if: env.HAS_SSH_KEY == 'true'
      uses: webfactory/ssh-agent@v0.8.1
      with:
        ssh-private-key: ${{ secrets.REMOTE_SSH_PRIVATE_KEY }}

    - name: Add remote to known_hosts (optional hardening)
      if: env.HAS_SSH_HOST == 'true'
      env:
        SSH_PORT: ${{ secrets.REMOTE_SSH_PORT || '22' }}
        SSH_HOST: ${{ secrets.REMOTE_SSH_HOST }}
      run: |
        ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts || true

    - name: Run deploy script on remote (key-based)
      if: env.HAS_SSH_KEY == 'true'
      env:
        REMOTE_SSH_HOST: ${{ secrets.REMOTE_SSH_HOST }}
        REMOTE_SSH_USER: ${{ secrets.REMOTE_SSH_USER || 'ubuntu' }}
        REMOTE_SSH_PORT: ${{ secrets.REMOTE_SSH_PORT || '22' }}
        REMOTE_SSH_PATH: ${{ secrets.REMOTE_SSH_PATH || '~/semlayer' }}
      run: |
        chmod +x scripts/deploy_remote.sh
        ./scripts/deploy_remote.sh "$REMOTE_SSH_HOST" "$REMOTE_SSH_USER" "$REMOTE_SSH_PATH" "$REMOTE_SSH_PORT"

    - name: Run deploy script on remote (password-based fallback)
      if: env.HAS_SSH_KEY != 'true' && env.HAS_SSH_PASSWORD == 'true'
      env:
        REMOTE_SSH_HOST: ${{ secrets.REMOTE_SSH_HOST }}
        REMOTE_SSH_USER: ${{ secrets.REMOTE_SSH_USER || 'ubuntu' }}
        REMOTE_SSH_PORT: ${{ secrets.REMOTE_SSH_PORT || '22' }}
        REMOTE_SSH_PATH: ${{ secrets.REMOTE_SSH_PATH || '~/semlayer' }}
        REMOTE_SSH_PASSWORD: ${{ secrets.REMOTE_SSH_PASSWORD }}
      run: |
        sudo apt-get update && sudo apt-get install -y sshpass
        chmod +x scripts/deploy_remote_password.sh
        ./scripts/deploy_remote_password.sh "$REMOTE_SSH_HOST" "$REMOTE_SSH_PASSWORD" "$REMOTE_SSH_USER" "$REMOTE_SSH_PATH" "$REMOTE_SSH_PORT"

    - name: Success
      run: echo "Remote deploy completed"
