name: Deploy Remote

on:
  push:
    branches:
      - main
    paths:
      - 'trino/**'
      - 'docker-compose.remote.yml'
      - 'scripts/deploy*'
      - 'backend/migrations/**'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_SSH_KEY: ${{ secrets.REMOTE_SSH_PRIVATE_KEY != '' }}
      HAS_SSH_PASSWORD: ${{ secrets.REMOTE_SSH_PASSWORD != '' }}
      HAS_TRINO_VERIFY: ${{ (secrets.TRINO_USER != '' && secrets.TRINO_PASSWORD != '') || secrets.REMOTE_TRINO_HOST != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          REMOTE_SSH_HOST: ${{ secrets.REMOTE_SSH_HOST }}
          REMOTE_SSH_PRIVATE_KEY: ${{ secrets.REMOTE_SSH_PRIVATE_KEY }}
          REMOTE_SSH_PATH: ${{ secrets.REMOTE_SSH_PATH }}
        run: |
          missing=0
          [ -z "$REMOTE_SSH_HOST" ] && { echo "ERROR: REMOTE_SSH_HOST secret not set"; missing=1; }
          [ -z "$REMOTE_SSH_PRIVATE_KEY" ] && { echo "ERROR: REMOTE_SSH_PRIVATE_KEY secret not set"; missing=1; }
          [ -z "$REMOTE_SSH_PATH" ] && { echo "ERROR: REMOTE_SSH_PATH secret not set - refusing to default (was ~/semlayer)"; missing=1; }
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "All required secrets present."

      - name: Start ssh-agent and add key
        if: env.HAS_SSH_KEY == 'true'
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.REMOTE_SSH_PRIVATE_KEY }}

      - name: Add remote to known_hosts
        if: env.HAS_SSH_KEY == 'true'
        env:
          REMOTE_SSH_HOST: ${{ secrets.REMOTE_SSH_HOST }}
          REMOTE_SSH_PORT: ${{ secrets.REMOTE_SSH_PORT || '22' }}
        run: ssh-keyscan -p "$REMOTE_SSH_PORT" "$REMOTE_SSH_HOST" >> ~/.ssh/known_hosts || true

      - name: Run deploy script on remote (key-based)
        if: env.HAS_SSH_KEY == 'true'
        env:
          REMOTE_SSH_HOST: ${{ secrets.REMOTE_SSH_HOST }}
          REMOTE_SSH_USER: ${{ secrets.REMOTE_SSH_USER || 'ubuntu' }}
          REMOTE_SSH_PORT: ${{ secrets.REMOTE_SSH_PORT || '22' }}
          REMOTE_SSH_PATH: ${{ secrets.REMOTE_SSH_PATH }}
        run: |
          chmod +x scripts/deploy_remote.sh
          ./scripts/deploy_remote.sh "$REMOTE_SSH_HOST" "$REMOTE_SSH_USER" "$REMOTE_SSH_PATH" "$REMOTE_SSH_PORT"

      - name: Run deploy script on remote (password fallback)
        if: env.HAS_SSH_KEY != 'true' && env.HAS_SSH_PASSWORD == 'true'
        env:
          REMOTE_SSH_HOST: ${{ secrets.REMOTE_SSH_HOST }}
          REMOTE_SSH_PASSWORD: ${{ secrets.REMOTE_SSH_PASSWORD }}
          REMOTE_SSH_USER: ${{ secrets.REMOTE_SSH_USER || 'ubuntu' }}
          REMOTE_SSH_PORT: ${{ secrets.REMOTE_SSH_PORT || '22' }}
          REMOTE_SSH_PATH: ${{ secrets.REMOTE_SSH_PATH }}
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass
          chmod +x scripts/deploy_remote_password.sh
          ./scripts/deploy_remote_password.sh "$REMOTE_SSH_HOST" "$REMOTE_SSH_PASSWORD" "$REMOTE_SSH_USER" "$REMOTE_SSH_PATH" "$REMOTE_SSH_PORT"

      - name: Trigger Verify Snapshot Backfill (post-deploy)
        if: env.HAS_TRINO_VERIFY == 'true'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'verify-snapshot-backfill.yml',
              ref: 'main'
            });
            core.info('Triggered verify-snapshot-backfill workflow.');

      - name: Success
        run: echo "Remote deploy + optional verification trigger completed"
