name: Stream Loader Image

# Builds the CDC stream loader image, and publishes it to GHCR on main.
#
# WHY THIS EXISTS. The loader image was last built by hand, eleven hours before the
# code it was supposed to contain had been merged. Nothing was red: `backend/Dockerfile.loader`
# compiled a single file (`go build .../main.go`), so the moment the loader was split
# across main.go / routing.go / query_pool.go / topology_tripwire.go / dlq_smoke.go the
# image could no longer be built at all -- and because CI never built it, nothing said
# so. A running container kept serving the pre-split binary while the branch looked
# merged and healthy.
#
# That is the same disease as the connector-config drift and the unmerged audit
# script: state that exists outside the deploy pipeline, maintained by whoever
# remembered. Anything that ships by "someone rebuilt it" eventually ships by
# "someone forgot".
#
# TWO JOBS, because they answer different questions:
#
#   verify-loader-image  runs on every PR that touches the loader. It builds and
#                        throws the image away. No registry, no secrets, no push.
#                        Its only job is to make a Dockerfile that cannot compile
#                        fail the PR that broke it -- which is exactly the signal
#                        that was missing.
#
#   publish-loader-image runs on main only. Builds, pushes, and runs Trivy against
#                        what it pushed, reporting to code scanning.
#
# Deployment should pull by digest rather than by tag, so "which code is running"
# has an answer that does not depend on someone's memory. Tags are still published
# for convenience and for local `docker pull` during an incident.

on:
  pull_request:
    paths:
      - 'backend/cmd/stream_loader/**'
      - 'backend/Dockerfile.loader'
      - 'backend/go.mod'
      - 'backend/go.sum'
      - 'go.work'
      - '.github/workflows/loader-image.yml'
  push:
    branches: [main]
    paths:
      - 'backend/cmd/stream_loader/**'
      - 'backend/Dockerfile.loader'
      - 'backend/go.mod'
      - 'backend/go.sum'
      - 'go.work'
      - '.github/workflows/loader-image.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}/stream-loader

jobs:
  # ---------------------------------------------------------------------------
  # Build-only gate. This is the part that would have caught the single-file
  # build bug on the PR that introduced it, rather than eleven hours later on a
  # deploy host during a fixture run.
  # ---------------------------------------------------------------------------
  verify-loader-image:
    name: verify-loader-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the loader image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile.loader
          # Build only. The point is that it compiles at all, and on a PR that
          # costs no registry write and needs no token.
          push: false
          load: true
          tags: ${{ env.IMAGE }}:verify
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prove the binary is the multi-file build
        # A Dockerfile that silently stops including the package's other files
        # would produce a *working* image from a stale cache or a narrowed context,
        # and the only way to know the routing, DLQ and tripwire code is really in
        # there is to ask the binary.
        #
        # These are string literals rather than Go symbol names on purpose. An
        # unexported function's name disappears from the binary the moment the
        # compiler inlines it, which would turn this gate red for a reason that has
        # nothing to do with the image being wrong -- and a gate that cries wolf is a
        # gate people learn to ignore. The literals below are behaviours that must be
        # present for the loader to do its job at all, and each one lives in a
        # specific file:
        #
        #   ERR_TENANT_UNAVAILABLE_ON_DELETE  routing.go  -- delete attribution
        #   REPLICA IDENTITY FULL              routing.go  -- names the fix
        #   Label Already Exists              main.go     -- idempotency
        #   tenant_unavailable_on_delete      main.go     -- metric name
        #   DLQ                               dlq_smoke.go
        #
        # If any is absent, the image was built without the full package and the
        # single-file regression is back.
        run: |
          docker create --name loader-verify ${{ env.IMAGE }}:verify
          docker cp loader-verify:/app/stream_loader ./stream_loader
          docker rm loader-verify
          chmod +x ./stream_loader
          missing=0
          for marker in \
              'ERR_TENANT_UNAVAILABLE_ON_DELETE' \
              'REPLICA IDENTITY FULL' \
              'Label Already Exists' \
              'tenant_unavailable_on_delete' \
              'DLQ smoke passed'; do
            if strings ./stream_loader | grep -qF "$marker"; then
              echo "ok: $marker"
            else
              echo "::error::stream_loader binary is missing '$marker' -- the image was built without the full package"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Smoke the binary's help/config path
        # It must at least start and refuse cleanly, rather than panicking on a
        # missing symbol or a bad flag.
        run: |
          timeout 20 ./stream_loader 2>&1 | head -20 || true

  # ---------------------------------------------------------------------------
  # Publish on main, with a Trivy result attached to code scanning.
  # ---------------------------------------------------------------------------
  publish-loader-image:
    name: publish-loader-image
    if: github.event_name != 'pull_request'
    needs: [verify-loader-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      # The digest, for pinning in a deployment.
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile.loader
          push: true
          # Commit sha is the immutable one. `main` is a moving convenience tag and
          # is exactly what let a stale container look current.
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: stream-loader-image

      - name: Record the published digest
        run: |
          echo "Published ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"
          echo "Pin deployments with:"
          echo "  image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"