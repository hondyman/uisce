# GitHub Actions CI/CD Pipeline for Semlayer
# Build, test, security scan, and deploy

name: CI/CD Pipeline

on:
  push:
    branches:
    - main
    - develop
    - 'release/**'
    tags:
    - 'v*'
  pull_request:
    branches:
    - main
    - develop

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # ==========================================================================
  # Which parts of the tree actually changed
  # ==========================================================================
  # Every job here used to run on every pull request unconditionally, so a
  # markdown edit paid the full cost of the backend test matrix - four shards
  # finishing at +7.2m on 99d5fe4d8. A docs-only change cannot break any of it.
  #
  # Two rules, both learned the hard way:
  #
  #  1. **A skipped gate is a silent gate.** A filter that forgets a path does
  #     not fail - it stops running and reports green. So the backend filter
  #     carries every shared input that can change a Go build, not just
  #     `backend/`: `go.work` at the repo root puts `libs/` and `cmd/` in the
  #     build, and this file itself holds the ASL drift gate.
  #  2. **main is the gate, so main is verified in full.** The filter applies
  #     only to `pull_request`. A push emits both flags true and runs
  #     everything, so whatever reaches main is always checked against the
  #     whole surface regardless of what the filter said on the PR.
  #
  # `security-scan` is deliberately NOT gated. It is the repo's security
  # posture, and since #357 removed its `needs:` it costs approximately zero
  # wall-clock anyway. Filtering it would trade real coverage for compute that
  # is not the bottleneck.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      # Both producing steps are read, because on a push only the second one
      # runs. Before this, the output read ONLY steps.filter, which is skipped on
      # a push -- so both flags were empty on every merge and every gated job
      # was skipped. `||` falls through to the push step, and `!= ''` keeps a
      # legitimate `false` from the filter step instead of overriding it.
      backend: ${{ steps.filter.outputs.backend || steps.push_all.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend || steps.push_all.outputs.frontend }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Filter (pull request)
      id: filter
      if: github.event_name == 'pull_request'
      uses: dorny/paths-filter@v3
      with:
        filters: |
          backend:
            - 'backend/**'
            - 'libs/**'
            - 'cmd/**'
            - 'calc-engine/**'
            - 'migrations/**'
            - 'go.work'
            - 'go.work.sum'
            - '.github/workflows/ci-cd.yml'
          frontend:
            - 'frontend/**'
            - 'frontend-temporal/**'
            - 'ui/**'
            - 'package.json'
            - 'pnpm-lock.yaml'

    - name: Verify everything (push to main)
      # The `id` is load-bearing: the job's outputs read this step, and without
      # one its writes to $GITHUB_OUTPUT are discarded.
      id: push_all
      if: github.event_name != 'pull_request'
      run: |
        echo "backend=true"  >> "$GITHUB_OUTPUT"
        echo "frontend=true" >> "$GITHUB_OUTPUT"

  # ==========================================================================
  # Build and Test
  # ==========================================================================
  build-backend:
    name: Build Backend
    needs: [changes]
    runs-on: ubuntu-latest
    # Gated on the backend filter. See `changes` above for why the filter is
    # deliberately broad and why pushes to main are never filtered.
    if: needs.changes.outputs.backend == 'true'
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: backend/go.mod
        cache: true
        cache-dependency-path: backend/go.sum

    - name: Generate Version
      id: version
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
        else
          VERSION=$(git describe --tags --always --dirty)-${{ github.run_number }}
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Build & Vet
      working-directory: backend
      run: |
        # Build every package and vet the result. This is the durable gate:
        # - go build ./... catches type/syntax/link errors across the whole graph
        # - go vet ./... catches correctness bugs the compiler can't see
        #   (the WithOptimizer race condition this engagement found, the copylock
        #   trap, etc.)
        # Together they prevent 'tests running blind through compilation failures'.
        go build ./...
        go vet ./...

    - name: Check ASL Schema/WASM Drift
      working-directory: backend/rule-engine
      run: |
        # Regenerates the Monaco editor schema/types/version info and the
        # browser rule_engine.wasm build from the current Go source
        # (internal/rules/vm), then fails if either is out of sync with
        # what's committed. Without this gate, a source change to the
        # rule/calc AST can land while the editor schema and the browser
        # evaluator silently keep describing the old shape - exactly the
        # failure mode (Monaco authoring a node the browser WASM build
        # couldn't evaluate) this pipeline exists to prevent.
        go run ./cmd/check-drift

    - name: Build Binaries
      working-directory: backend
      # The backend entry points the image builds (backend/Dockerfile). The earlier
      # api-gateway / semantic-engine / governance-engine lines pointed at
      # backend/cmd directories that do not exist (api-gateway is its own module at
      # the repo root), so this step could never have passed.
      run: |
        CGO_ENABLED=0 GOOS=linux go build -ldflags="-s -w -X main.Version=${{ steps.version.outputs.version }}" -o bin/server ./cmd/server
        CGO_ENABLED=0 GOOS=linux go build -ldflags="-s -w -X main.Version=${{ steps.version.outputs.version }}" -o bin/worker ./cmd/worker

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: backend-binaries
        path: backend/bin/

  # ==========================================================================
  # Hermetic backend tests, sharded
  # ==========================================================================
  # This was one step inside build-backend: `go test -short -v -race
  # -coverprofile=coverage.out ./...` over 498 packages, measured at 7.6m of
  # a 13.4m job. It was the single largest item on the pipeline's critical
  # path, and it grew linearly with the package count while the rest of the
  # suite was already parallel.
  #
  # Splitting it across a 4-way matrix takes it to ~1.9m per shard. The two
  # properties that make this safe, both verified rather than assumed:
  #
  #   1. The shards PARTITION the package set. `go list ./... | awk NR % 4`
  #      assigns every package to exactly one shard - verified as a bijection
  #      (498 in, 498 assigned, 498 unique, none in two shards). A package
  #      tested by no shard would be a silent coverage hole, which is why
  #      this was checked before the workflow was touched.
  #   2. Coverage profiles from disjoint package sets concatenate into a
  #      valid single profile - one `mode:` header plus every data line.
  #      Verified by generating two real profiles and running
  #      `go tool cover -func` on the concatenation. Each shard uploads its
  #      own profile under the same `backend` flag and codecov merges them
  #      server-side, which avoids a merge job on the critical path.
  #
  # No test is removed and none is skipped: the union of the four shards is
  # exactly `go test ./...`. The change is only that they run concurrently.
  #
  # Deliberately NOT gated on build-backend. Compiling is what proves the
  # tree builds, and this job compiles too, so a build failure fails both -
  # adding `needs: build-backend` would serialise ~6m of build work ahead of
  # ~4m of test work and give back most of what sharding bought.
  backend-tests:
    name: Backend Tests (${{ matrix.shard }}/4)
    needs: [changes]
    runs-on: ubuntu-latest
    # Gated on the same filter as build-backend, so the shards can never run
    # for a tree that build-backend would not have built either.
    if: needs.changes.outputs.backend == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: backend/go.mod
        cache: true
        cache-dependency-path: backend/go.sum

    - name: Select shard
      id: shard
      working-directory: backend
      run: |
        # 1-based shard ids, so the expression must be (NR-1)%n+1 and not
        # NR%n: with NR%n, shard 4 matches nothing, silently leaves ~a
        # quarter of the packages untested, and reports success. Verified
        # both forms against the real package list - 125/125/124/124 = 498.
        go list ./... | awk -v n=4 -v i=${{ matrix.shard }} '(NR-1) % n + 1 == i' > shard.txt
        count=$(wc -l < shard.txt | tr -d ' ')
        echo "shard ${{ matrix.shard }}/4: $count packages"
        # Belt and braces: a shard that selected nothing would otherwise
        # pass having tested nothing, which is the worst way for a gate to
        # fail. 498 packages / 4 shards, so anything under 100 means the
        # partition is wrong, not that the tree shrank.
        if [ "$count" -lt 100 ]; then
          echo "::error::shard ${{ matrix.shard }} selected only $count packages; expected ~125 of 498"
          exit 1
        fi

    - name: Run Tests
      working-directory: backend
      run: |
        go test -short -race -coverprofile=coverage.out $(tr '\n' ' ' < shard.txt)
        go tool cover -func=coverage.out | tail -1

    - name: Upload Coverage
      uses: codecov/codecov-action@v4
      with:
        files: backend/coverage.out
        flags: backend
        name: backend-shard-${{ matrix.shard }}

  # ==========================================================================
  # Backend integration tests (real service dependencies)
  # ==========================================================================
  # The hermetic tier is the `backend-tests` matrix above: `go test` with no
  # -tags, no service containers, must always be green - that's the gate
  # that can say no. Files needing a real external dependency (Postgres, a
  # real
  # websocket round trip that's flaky/failing in CI for reasons still under
  # investigation - see docs/unified-rule-engine-handoff.md item 59) declare
  # `//go:build integration` so they're excluded from that tier by
  # construction, not by a runtime skip that could silently vary by
  # environment.
  #
  # This job is their other half: it passes -tags=integration, so those
  # files compile and run for real, against a real Postgres (the same
  # service-container recipe .github/workflows/integration.yml already
  # proves works). Every integration-tagged test therefore runs in exactly
  # one CI job, for real, with its outcome visible - not skipped in every
  # executed run, which the pipeline handoff's own §5 rule names as the
  # trap to avoid (a test that only ever skips is not a gate).
  #
  # Deliberately scoped to the two packages verified this session
  # (internal/bundles, internal/handlers) rather than `./...` - broader
  # classification of which other *_integration_test.go files genuinely
  # need real services (vs. being misleadingly named - several found this
  # session use sqlmock/httptest and are actually hermetic) is real,
  # separate work, not yet done. See item 59 for the full audit and what's
  # still unclassified.
  integration-tests-backend:
    name: Integration Tests (Backend)
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector/pgvector, not stock postgres: the schema snapshot creates the
        # `vector` extension and was dumped from Postgres 18 (same image as the
        # gated-tests job).
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: alpha
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
        - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=5s --health-retries=5

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: backend/go.mod
        cache: true
        cache-dependency-path: backend/go.sum

    - name: Wait for Postgres
      run: |
        sudo apt-get update && sudo apt-get install -y postgresql-client
        for i in {1..30}; do
          pg_isready -h localhost -p 5432 -U postgres && break
          sleep 1
        done

    - name: Bootstrap database schema
      # The service container starts with an EMPTY database. Build the real schema
      # (roles, snapshot, gold-copy tenant, migrate up) so DB-backed integration
      # tests have tables and the gold-copy tenant they assume.
      run: backend/scripts/ci_bootstrap_db.sh

    - name: Run integration-tagged tests
      working-directory: backend
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/alpha?sslmode=disable
        # The policy-DB DSN resolver consults config.yaml before DATABASE_URL,
        # and the tracked backend/config.yaml points at a private host. Naming
        # the bootstrapped service here makes it the first candidate, so tests
        # stop paying a TCP timeout to discover the database CI just built.
        POLICY_DB_URL: postgres://postgres:postgres@localhost:5432/alpha?sslmode=disable
      run: go test -tags=integration -v ./internal/bundles/... ./internal/handlers/... ./internal/audit/... ./internal/api/...

  # The matrix above cannot itself be a required status check: its legs report
  # `Backend Tests (1/4)` .. `(4/4)` on a full run and the literal, unrendered
  # `Backend Tests (${{ matrix.shard }}/4)` when this workflow's path filter
  # skips the job. Requiring either name strands a class of pull requests.
  #
  # This job is the stable name the required set can point at. It has no path
  # condition of its own, so it always reports, and it reads the matrix's
  # aggregate result rather than its per-leg names.
  backend-tests-summary:
    name: Backend Tests Summary
    runs-on: ubuntu-latest
    needs: [backend-tests]
    if: always()
    steps:
    - name: Verify every shard passed
      env:
        # Aggregate over the whole matrix: success | failure | cancelled | skipped.
        MATRIX_RESULT: ${{ needs.backend-tests.result }}
      run: |
        echo "backend-tests matrix result: $MATRIX_RESULT"
        # `skipped` is passed through deliberately. A path-filtered pull request
        # skips the matrix, and a required check that went red here would make
        # every such pull request fail -- the same silence, inverted. Measured:
        # a check reporting SKIPPED satisfies a required check; only a check that
        # is never reported blocks the pull request.
        if [ "$MATRIX_RESULT" != "success" ] && [ "$MATRIX_RESULT" != "skipped" ]; then
          echo "::error::one or more backend test shards did not pass (result: $MATRIX_RESULT)"
          exit 1
        fi
        if [ "$MATRIX_RESULT" = "skipped" ]; then
          echo "matrix skipped by the path filter; nothing to summarise"
        fi

  build-frontend:
    name: Build Frontend
    needs: [changes]
    runs-on: ubuntu-latest
    # Gated on the frontend filter.
    if: needs.changes.outputs.frontend == 'true'

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache-dependency-path: frontend/pnpm-lock.yaml

    - name: Install Dependencies
      working-directory: frontend
      run: pnpm install --frozen-lockfile

    - name: Verify rule_engine.wasm
      run: |
        # frontend/public/rule_engine.wasm is a manually-synced copy of
        # backend/rule-engine/generated/rule_engine.wasm, not built or
        # symlinked from it - nothing else in this pipeline catches it
        # going stale (a prior session's AST rewrite shipped without this
        # file being updated, so the browser kept silently mis-evaluating
        # rules against the old AST shape for a while). Byte-diffing
        # against a fresh build doesn't work either - Go's GOOS=js/wasm
        # output isn't reproducible build-to-build - so this checks
        # functional correctness of the exact shipped file instead.
        node backend/rule-engine/scripts/verify_wasm.js

    - name: Run Tests
      working-directory: frontend
      run: pnpm test -- --coverage

    - name: Build
      working-directory: frontend
      run: pnpm build

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: frontend/dist/

  # ==========================================================================
  # Security Scanning
  # ==========================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    # NO `needs:`. This job checks the repository out fresh and scans the source
    # tree itself - Trivy fs, Snyk, Gosec on ./backend/... - so it consumes no
    # artifact, output or build product from build-backend or build-frontend.
    # It used to declare `needs: [build-backend, build-frontend]`, which
    # serialized a 8-11 minute full scan behind 10-13 minutes of builds and made
    # it additive to every pull request's wall-clock.
    #
    # Measured (main, CI/CD Pipeline, wall-clock vs longest single job):
    #   37143104980  actual 22.6m   longest job 12.8m   builds+scan 21.8m
    #   37131153050  actual 24.4m   longest job 10.1m   builds+scan 18.4m
    #   37129484109  actual 36.1m   longest job 13.4m   builds+scan 23.9m
    #   37129470823  actual 24.6m   longest job 11.1m   builds+scan 21.0m
    # The longest-single-job figure was off by 9.8-22.7m; the dependency-chain
    # figure tracked reality to 0.8-12.2m. The scan is on the critical path in
    # EVERY run, not the one in three that a max-job reading suggested.
    #
    # On push to main, docker-build still declares
    # `needs: [..., security-scan]`, so image scanning still runs after the source
    # scan completes. Nothing about what is scanned changes; only when it starts.
    #
    # Repo default token is read-only; uploading SARIF to code scanning needs this.
    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner (filesystem)
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Run Snyk
      uses: snyk/actions/node@master
      continue-on-error: true
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --all-projects --severity-threshold=high

    - name: Run Gosec
      uses: securego/gosec@master
      with:
        args: '-no-fail -fmt sarif -out gosec-results.sarif ./backend/...'

    - name: Upload Gosec results
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'gosec-results.sarif'

  # ==========================================================================
  # Build and Push Docker Images
  # ==========================================================================
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [ build-backend, build-frontend, security-scan ]
    # QUARANTINED 2026-10-03 - this job has never built an image.
    #
    # The matrix below resolves every entry to ./backend/Dockerfile.<service>,
    # and not one of the five resolves:
    #   ai-builder         -> docker-builders/Dockerfile.ai-builder
    #   semantic-engine    -> docker-builders/Dockerfile.semantic-engine
    #   compliance-engine  -> docker-builders/Dockerfile.compliance-engine
    #   governance-engine  -> docker-builders/Dockerfile.governance
    #                          (right directory, different name)
    #   api-gateway        -> no Dockerfile and no service directory anywhere
    #                          in the repository
    # Meanwhile backend/ holds 14 Dockerfiles (audit-worker, catalog-sync,
    # catalog-worker, cdc, event-router, kafka-connect-iceberg, loader,
    # notifications, outbox-processor, policy, search, snapshot-worker,
    # sync-worker) and NONE of them appear in the matrix.
    #
    # The matrix has been wrong since b9fc5e129, the initial commit. Because
    # the job is gated `!= 'pull_request'`, it only ever ran on main pushes,
    # so it never appeared in any PR's checks and never blocked a merge - it
    # only guaranteed that main stayed red. It has `push: true` and
    # `packages: write`, so running it is a registry-publishing decision, not
    # a path fix, and is not something to re-enable without deciding what
    # should actually be published to GHCR.
    #
    # The job is retained rather than deleted so the intent stays auditable.
    # To re-enable: set the repository variable DOCKER_BUILD_ENABLED=true.
    # A skipped job does not fail the run. See docs/FAILURES_LEDGER.md.
    if: vars.DOCKER_BUILD_ENABLED == 'true' && github.event_name != 'pull_request'
    # Push images to GHCR and upload their Trivy results to code scanning.
    permissions:
      contents: read
      packages: write
      security-events: write

    strategy:
      matrix:
        service:
        - api-gateway
        - semantic-engine
        - governance-engine
        - ai-builder
        - compliance-engine

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix=

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./backend/Dockerfile.${{ matrix.service }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          VERSION=${{ needs.build-backend.outputs.version }}

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
        format: 'sarif'
        output: 'trivy-${{ matrix.service }}.sarif'
        severity: 'CRITICAL,HIGH'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-${{ matrix.service }}.sarif'

