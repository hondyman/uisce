name: A11y Ratchet

# DISABLED for now (manual runs only). The crawl's pre-flight needs a backend at
# 127.0.0.1:8080 and this job starts only the dev server, so it aborted with
# ECONNREFUSED on every frontend PR before scanning a single route. Restore the
# triggers below once the job boots a backend (or the pre-flight is relaxed).
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths:
  #     - 'frontend/**'
  #     - 'scripts/a11y-ratchet.mjs'
  # pull_request:
  #   branches: [main]
  #   paths:
  #     - 'frontend/**'
  #     - 'scripts/a11y-ratchet.mjs'

jobs:
  a11y-ratchet:
    name: A11y Ratchet Gate
    runs-on: ubuntu-latest
    # Job-level so the baseline crawl gets it too; it refuses to run without a real JWT.
    env:
      E2E_JWT: ${{ secrets.E2E_JWT }}
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start dev server
        working-directory: frontend
        run: npm run dev &

      - name: Wait for dev server
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:5173 > /dev/null 2>&1; then
              echo "Dev server ready"
              break
            fi
            sleep 5
          done

      - name: Run locale-matrix smoke tests
        working-directory: frontend
        run: npx playwright test --config=playwright.a11y.config.ts locale-matrix.spec.ts

      - name: Run a11y baseline crawl
        working-directory: frontend
        # FIRST REAL CRAWL EXPECTED TO FIND VIOLATIONS. This gate has never
        # scanned the app before - E2E_JWT only started reaching the baseline
        # crawl in #331. So a wall of findings on the first run means the
        # ratchet is STARTING, not that something regressed. Do not "fix" it by
        # baselining the findings wholesale, and do not disable the gate on the
        # strength of a first-run failure. Record the real numbers, then let
        # the ratchet hold them.
        run: npx playwright test --config=playwright.a11y.config.ts baseline.spec.ts

      - name: Aggregate baseline
        working-directory: frontend
        run: node scripts/aggregate-a11y-baseline.mjs

      - name: Run ratchet
        run: node scripts/a11y-ratchet.mjs
