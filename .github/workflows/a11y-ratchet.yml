name: A11y Ratchet

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'scripts/a11y-ratchet.mjs'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'scripts/a11y-ratchet.mjs'

jobs:
  a11y-ratchet:
    name: A11y Ratchet Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run a11y baseline crawl
        working-directory: frontend
        # Use playwright.a11y.config.ts explicitly — the default playwright.config.ts
        # has a `webServer` block calling `npm start` which doesn't exist in
        # package.json (we have `dev`). The a11y config uses `npm run dev` and
        # its webServer block manages the dev server lifecycle.
        run: npx playwright test --config=playwright.a11y.config.ts --reporter=line

      - name: Aggregate baseline
        working-directory: frontend
        run: node scripts/aggregate-a11y-baseline.mjs

      - name: Run ratchet
        run: node scripts/a11y-ratchet.mjs
