name: Hybrid Stack CI

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
            node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
            go-version: '1.25'
            
      - name: Run Backend Tests
        run: go test ./backend/...

      - name: Dry-run Semantic Diff
        run: |
          # Placeholder for dry-run script
          echo "Executing dry-run diff against staging..."
          # node scripts/dryrun-diff.js
