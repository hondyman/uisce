name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install root deps (if present)
      run: |
        if [ -f package.json ]; then npm install; fi

    - name: Install frontend deps
      working-directory: frontend
      run: npm ci --legacy-peer-deps

    - name: Typecheck frontend (ratchet - fails only on errors not in docs/ts-baseline.txt)
      working-directory: frontend
      run: node scripts/ts-ratchet.mjs

    - name: Build frontend
      working-directory: frontend
      run: npm run build --if-present
  # Optional: add backend Go build/test job in the future
